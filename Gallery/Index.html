<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dynamic Image and Video Slider from GitHub</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css'>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap");

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Lexend", sans-serif;
            background-color: #362a2b;
            color: #e5ebf3;
        }

        .slider {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .slide.current {
            opacity: 1;
        }

        .buttons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 20px;
            z-index: 10; /* Ensure buttons are on top */
        }

        .buttons button {
            border: 2px solid #e5ebf3;
            background-color: transparent;
            color: #e5ebf3;
            cursor: pointer;
            padding: 13px 15px;
            border-radius: 50%;
            outline: none;
            margin: 0 5px;
        }

        .buttons button:hover {
            background-color: #e5ebf3;
            color: #362a2b;
        }

        .thumbnail-container {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }

        .thumbnail {
            width: 100px;
            height: 100px;
            margin: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.3s ease;
            opacity: 0.75;
        }

        .thumbnail.selected {
            border: 2px solid #e5ebf3;
            opacity: 1;
        }

        .button-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }

        .button-container button {
            border: 2px solid #e5ebf3;
            background-color: transparent;
            color: #e5ebf3;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 5px;
            opacity: 0.3;
            transition: background-color 0.3s, color 0.3s;
        }

        .button-container button:hover {
            background-color: #e5ebf3;
            color: #362a2b;
            opacity: 0.5;
        }

        .video-controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            z-index: 10;
            width: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensure the video covers the slide */
        }

        .commit-timestamp {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px;
            color: #e5ebf3;
            font-size: 7px;
            text-align: center;
            opacity: 0.3;
            white-space: nowrap;
        }

        /* Ensure full image is displayed in slides */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the full image is displayed */
            display: block; /* Prevents extra space below images */
        }
    </style>
</head>

<body>
    <div class="video-controls" id="video-controls">
        <!-- Video controls will be injected here -->
    </div>

    <div class="slider" id="slider"></div>
    <div class="buttons">
        <button id="prev" aria-label="Previous Slide"><i class="fas fa-arrow-left"></i></button>
        <button id="next" aria-label="Next Slide"><i class="fas fa-arrow-right"></i></button>
    </div>

    <div class="button-container">
        <button class="toggle-thumbnails" id="toggle-button">🗃️</button>
        <button class="randomize-button" id="randomize-button">🎉</button>
        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" />
        <button id="uploadButton">📸</button>
    </div>

    <div class="thumbnail-container" id="thumbnail-container"></div>
    <div class="commit-timestamp" id="commit-timestamp"></div>

    <script>
        const slidesContainer = document.getElementById("slider");
        const videoControlsContainer = document.getElementById("video-controls");
        const nextButton = document.getElementById("next");
        const prevButton = document.getElementById("prev");
        const toggleButton = document.getElementById("toggle-button");
        const randomizeButton = document.getElementById("randomize-button");
        const thumbnailContainer = document.getElementById("thumbnail-container");
        const commitTimestamp = document.getElementById("commit-timestamp");
        const fileInput = document.getElementById("fileInput");
        const uploadButton = document.getElementById("uploadButton");
        let currentIndex = 0;
        const intervalTime = 20000; // Time in milliseconds (20 seconds)
        let slideInterval; // Variable to hold the interval

        // GitHub repository details
        const repoUsername = "IkeSimba"; // Your GitHub username
        const repoName = "MyUrl";         // Your repository name
        const branch = "V0";               // Your branch name
        const folderPath = "Gallery";      // Path to your images folder

        let mediaFiles = []; // To store all media URLs (images and videos)

        async function fetchMedia() {
            const apiUrl = `https://api.github.com/repos/${repoUsername}/${repoName}/contents/${folderPath}?ref=${branch}`;
            const response = await fetch(apiUrl);
            if (!response.ok) {
                console.error("Failed to fetch media:", response.statusText);
                return;
            }
            const data = await response.json();
            mediaFiles = data
                .filter(file => /\.(jpg|jpeg|png|gif|mp4|webm|mov)$/i.test(file.name)) // Include .mov
                .sort((a, b) => a.name.localeCompare(b.name))
                .map(file => `https://raw.githubusercontent.com/${repoUsername}/${repoName}/${branch}/${folderPath}/${file.name}`);

            console.log("Fetched media files:", mediaFiles); // Log constructed media URLs

            // Start with a random index
            currentIndex = Math.floor(Math.random() * mediaFiles.length);
            updateSlider();
            updateCommitTimestamp();
            startSlideShow(); // Start the automatic slideshow
        }

        async function initSlider() {
            await fetchMedia();
            createSlides();
            updateSlider();
        }

        function createSlides() {
            slidesContainer.innerHTML = ''; // Clear existing slides
            mediaFiles.forEach((media, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                if (index === currentIndex) slide.classList.add('current');

                // Create video element only if the media is a video
                if (media.endsWith('.mp4') || media.endsWith('.webm') || media.endsWith('.mov')) {
                    const video = document.createElement('video');
                    video.src = media;
                    // video.controls = true; // Enable controls for the video
                    slide.appendChild(video);
                } else {
                    const img = document.createElement('img'); // Create image element
                    img.src = media; // Set the source
                    slide.appendChild(img); // Append image to slide
                }

                slidesContainer.appendChild(slide);

                // Create thumbnail for each media
                const thumbnail = document.createElement('img');
                thumbnail.src = media;
                thumbnail.className = 'thumbnail';
                thumbnail.addEventListener('click', () => {
                    currentIndex = index;
                    updateSlider();
                });
                thumbnailContainer.appendChild(thumbnail);
            });
        }

        function updateSlider() {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                slide.classList.remove('current');
                if (index === currentIndex) {
                    slide.classList.add('current');
                }
            });
            updateVideoControls();
            updateThumbnails();
        }

        function updateThumbnails() {
            const thumbnails = document.querySelectorAll('.thumbnail');
            thumbnails.forEach((thumbnail, index) => {
                thumbnail.classList.remove('selected');
                if (index === currentIndex) {
                    thumbnail.classList.add('selected');
                }
            });
        }

        function updateVideoControls() {
            videoControlsContainer.innerHTML = ''; // Clear previous controls
            if (mediaFiles[currentIndex].endsWith('.mp4') || mediaFiles[currentIndex].endsWith('.webm') || mediaFiles[currentIndex].endsWith('.mov')) {
                const video = document.querySelector('.slide.current video');
                if (video) {
                    // Create play/pause button
                    const playPauseButton = document.createElement('button');
                    playPauseButton.textContent = video.paused ? '▶' : '❚❚';
                    playPauseButton.onclick = () => {
                        if (video.paused) {
                            video.play();
                        } else {
                            video.pause();
                        }
                        playPauseButton.textContent = video.paused ? '▶' : '❚❚';
                    };
                    videoControlsContainer.appendChild(playPauseButton);
                }
            }
        }

        function startSlideShow() {
            slideInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % mediaFiles.length; // Loop back to start
                updateSlider();
            }, intervalTime);
        }

        nextButton.addEventListener("click", () => {
            currentIndex = (currentIndex + 1) % mediaFiles.length; // Go to next index, loop if needed
            updateSlider();
        });

        prevButton.addEventListener("click", () => {
            currentIndex = (currentIndex - 1 + mediaFiles.length) % mediaFiles.length; // Go to previous index, loop if needed
            updateSlider();
        });

        toggleButton.addEventListener("click", () => {
            thumbnailContainer.style.display = thumbnailContainer.style.display === "flex" ? "none" : "flex";
        });

        randomizeButton.addEventListener("click", () => {
            currentIndex = Math.floor(Math.random() * mediaFiles.length);
            updateSlider();
        });

        uploadButton.addEventListener("click", () => {
            fileInput.click(); // Trigger file input click
        });

        fileInput.addEventListener("change", (event) => {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                mediaFiles.push(url); // Add uploaded media to array
                createSlides(); // Recreate slides with new media
                updateSlider();
            });
            event.target.value = ''; // Reset input value
        });

        function updateCommitTimestamp() {
            const timestamp = new Date().toLocaleString();
            commitTimestamp.textContent = `Last updated: ${timestamp}`;
        }

        initSlider();
    </script>
</body>

</html>
