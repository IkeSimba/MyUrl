<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Image and Video Slider</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap");

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Lexend", sans-serif;
            background-color: #362a2b;
            color: #e5ebf3;
        }

        .slider {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .slide.current {
            opacity: 1;
        }

        .buttons {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: space-between; /* Aligns buttons to left and right */
            padding: 0 20px; /* Add padding to the sides */
        }

        .buttons button {
            border: 2px solid #e5ebf3;
            background-color: transparent;
            color: #e5ebf3;
            cursor: pointer;
            width: 50px; /* Set width for circular shape */
            height: 50px; /* Set height for circular shape */
            border-radius: 50%; /* Make circular */
            display: flex;
            align-items: center; /* Center icon vertically */
            justify-content: center; /* Center icon horizontally */
            margin: 0 5px;
            opacity: 0.3;
            transition: background-color 0.3s, color 0.3s, opacity 0.3s;
        }

        .buttons button:hover {
            background-color: #e5ebf3;
            color: #362a2b;
            opacity: 0.5;
        }

        .button-container {
            position: absolute;
            bottom: 80px; /* Position the additional buttons above the main buttons */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .button-container button {
            border: 2px solid #e5ebf3;
            background-color: transparent;
            color: #e5ebf3;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 50%;
            margin: 0 5px;
            opacity: 0.3;
            transition: background-color 0.3s, color 0.3s, opacity 0.3s;
        }

        .button-container button:hover {
            background-color: #e5ebf3;
            color: #362a2b;
            opacity: 0.5;
        }

        .thumbnail-container {
            display: none; /* Change to flex if you want it to show initially */
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }

        .thumbnail {
            width: 100px;
            height: 100px;
            margin: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.3s ease, opacity 0.3s;
            opacity: 0.75;
        }

        .thumbnail.selected {
            border: 2px solid #e5ebf3;
            opacity: 1;
        }

        .commit-timestamp {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px;
            color: #e5ebf3;
            font-size: 7px;
            text-align: center;
            opacity: 0.3;
            white-space: nowrap;
        }

        /* New styles for video controls positioning */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: calc(100% - 40px); /* Leave space for controls */
            position: absolute;
            top: 40px; /* Space for controls above */
            left: 0;
        }

        .video-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="slider" id="slider"></div>
    <div class="buttons">
        <button id="prev" aria-label="Previous Slide"><i class="fas fa-arrow-left"></i></button>
        <button id="next" aria-label="Next Slide"><i class="fas fa-arrow-right"></i></button>
    </div>

    <div class="button-container">
        <button class="toggle-thumbnails" id="toggle-button">🗃️</button>
        <button class="randomize-button" id="randomize-button">🎉</button>
        <button id="uploadButton">📸</button>
    </div>

    <div class="thumbnail-container" id="thumbnail-container"></div>
    <div class="commit-timestamp" id="commit-timestamp"></div>

    <script>
        (function() {
            const slidesContainer = document.getElementById("slider");
            const nextButton = document.getElementById("next");
            const prevButton = document.getElementById("prev");
            const toggleButton = document.getElementById("toggle-button");
            const randomizeButton = document.getElementById("randomize-button");
            const thumbnailContainer = document.getElementById("thumbnail-container");
            const commitTimestamp = document.getElementById("commit-timestamp");
            const uploadButton = document.getElementById("uploadButton");
            let currentIndex = 0;
            let originalFiles = [];

            const repoUsername = "IkeSimba";
            const repoName = "MyUrl";
            const branch = "V0";
            const folderPath = "Gallery";

            async function fetchFiles() {
                const apiUrl = `https://api.github.com/repos/${repoUsername}/${repoName}/contents/${folderPath}?ref=${branch}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                originalFiles = data
                    .filter(file => /\.(jpg|jpeg|png|gif|mp4|mov)$/i.test(file.name))
                    .sort((a, b) => a.name.localeCompare(b.name))
                    .map(file => `https://raw.githubusercontent.com/${repoUsername}/${repoName}/${branch}/${folderPath}/${file.name}`);

                currentIndex = Math.floor(Math.random() * originalFiles.length);
                updateSlider();
                updateCommitTimestamp();
            }

            async function initSlider() {
                await fetchFiles();
                createSlides();
            }

            function createSlides() {
                slidesContainer.innerHTML = '';
                thumbnailContainer.innerHTML = '';

                originalFiles.forEach((file, index) => {
                    const slide = document.createElement('div');
                    slide.className = 'slide';
                    if (index === currentIndex) slide.classList.add('current');

                    if (file.endsWith('.mp4') || file.endsWith('.mov')) {
                        createVideoSlide(slide, file);
                    } else {
                        createImageSlide(slide, file);
                    }

                    slidesContainer.appendChild(slide);
                });

                updateThumbnails();
            }

            function createVideoSlide(slide, file) {
                const videoContainer = document.createElement('div');
                videoContainer.className = 'video-container';

                const video = document.createElement('video');
                video.src = file;
                video.controls = true;
                video.preload = 'metadata'; // Optional for performance

                // Event listener to play/pause video on click
                slide.addEventListener('click', () => {
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                });

                videoContainer.appendChild(video);
                slide.appendChild(videoContainer);

                const thumbnail = createThumbnailCanvas(video);
                thumbnailContainer.appendChild(thumbnail);
            }

            function createImageSlide(slide, file) {
                slide.style.backgroundImage = `url("${file}")`;
                slide.style.backgroundRepeat = "no-repeat";
                slide.style.backgroundPosition = "center";
                slide.style.backgroundSize = "contain";

                const thumbnail = document.createElement('img');
                thumbnail.src = file;
                thumbnail.className = 'thumbnail';
                thumbnailContainer.appendChild(thumbnail);
            }

            function createThumbnailCanvas(video) {
                const thumbnail = document.createElement('canvas');
                const context = thumbnail.getContext('2d');
                thumbnail.width = 100;
                thumbnail.height = 100;
                thumbnail.className = 'thumbnail';
                video.addEventListener('loadeddata', () => {
                    context.drawImage(video, 0, 0, thumbnail.width, thumbnail.height);
                });
                thumbnail.addEventListener('click', () => {
                    currentIndex = Array.from(thumbnailContainer.children).indexOf(thumbnail);
                    updateSlider();
                });
                return thumbnail;
            }

            function updateSlider() {
                const slides = document.querySelectorAll('.slide');
                slides.forEach((slide, index) => {
                    slide.classList.remove('current');
                    const video = slide.querySelector('video');
                    if (video) video.pause(); // Pause video on slide change
                    if (index === currentIndex) {
                        slide.classList.add('current');
                        if (video) {
                            video.currentTime = 0; // Optional: Reset video time
                            video.play(); // Play the current video
                        }
                    }
                });
                highlightThumbnail();
            }

            function highlightThumbnail() {
                const thumbnails = thumbnailContainer.querySelectorAll('.thumbnail');
                thumbnails.forEach((thumbnail, index) => {
                    thumbnail.classList.toggle('selected', index === currentIndex);
                });
            }

            function updateCommitTimestamp() {
                const commitDate = new Date();
                commitTimestamp.innerText = `Last updated: ${commitDate.toLocaleString()}`;
            }

            nextButton.addEventListener("click", () => {
                currentIndex = (currentIndex + 1) % originalFiles.length;
                updateSlider();
            });

            prevButton.addEventListener("click", () => {
                currentIndex = (currentIndex - 1 + originalFiles.length) % originalFiles.length;
                updateSlider();
            });

            toggleButton.addEventListener("click", () => {
                thumbnailContainer.style.display = thumbnailContainer.style.display === 'none' ? 'flex' : 'none';
            });

            randomizeButton.addEventListener("click", () => {
                currentIndex = Math.floor(Math.random() * originalFiles.length);
                updateSlider();
            });

            uploadButton.addEventListener("click", () => {
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*,video/*';
                fileInput.onchange = async (event) => {
                    const file = event.target.files[0];
                    const formData = new FormData();
                    formData.append('file', file);

                    // Add the upload logic here

                    await fetchFiles(); // Refresh the file list after upload
                };
                fileInput.click();
            });

            initSlider();
        })();
    </script>
</body>
</html>
