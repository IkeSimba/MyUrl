<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dynamic Image and Video Slider from GitHub</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css'>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap");

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Lexend", sans-serif;
            background-color: #362a2b;
            color: #e5ebf3;
        }

        .slider {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .slide.current {
            opacity: 1;
        }

        .buttons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 20px;
        }

        .buttons button {
            border: 2px solid #e5ebf3;
            background-color: transparent;
            color: #e5ebf3;
            cursor: pointer;
            padding: 13px 15px;
            border-radius: 50%;
            outline: none;
            margin: 0 5px;
        }

        .buttons button:hover {
            background-color: #e5ebf3;
            color: #362a2b;
        }

        .thumbnail-container {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }

        .thumbnail {
            width: 100px;
            height: 100px;
            margin: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.3s ease;
            opacity: 0.75;
        }

        .thumbnail.selected {
            border: 2px solid #e5ebf3;
            opacity: 1;
        }

        .button-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }

        .button-container button {
            border: 2px solid #e5ebf3;
            background-color: transparent;
            color: #e5ebf3;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 5px;
            opacity: 0.3;
            transition: background-color 0.3s, color 0.3s;
        }

        .button-container button:hover {
            background-color: #e5ebf3;
            color: #362a2b;
            opacity: 0.5;
        }

        .video-controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            z-index: 10;
            width: 100%;
        }

        .commit-timestamp {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px;
            color: #e5ebf3;
            font-size: 7px;
            text-align: center;
            opacity: 0.3;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="video-controls" id="video-controls">
        <!-- Video controls will be injected here -->
    </div>

    <div class="slider" id="slider"></div>
    <div class="buttons">
        <button id="prev" aria-label="Previous Slide"><i class="fas fa-arrow-left"></i></button>
        <button id="next" aria-label="Next Slide"><i class="fas fa-arrow-right"></i></button>
    </div>

    <div class="button-container">
        <button class="toggle-thumbnails" id="toggle-button">🗃️</button>
        <button class="randomize-button" id="randomize-button">🎉</button>
        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" />
        <button id="uploadButton">📸</button>
    </div>

    <div class="thumbnail-container" id="thumbnail-container"></div>
    <div class="commit-timestamp" id="commit-timestamp"></div>

    <script>
        const slidesContainer = document.getElementById("slider");
        const videoControlsContainer = document.getElementById("video-controls");
        const nextButton = document.getElementById("next");
        const prevButton = document.getElementById("prev");
        const toggleButton = document.getElementById("toggle-button");
        const randomizeButton = document.getElementById("randomize-button");
        const thumbnailContainer = document.getElementById("thumbnail-container");
        const commitTimestamp = document.getElementById("commit-timestamp");
        const fileInput = document.getElementById("fileInput");
        const uploadButton = document.getElementById("uploadButton");
        let currentIndex = 0;
        const intervalTime = 20000; // Time in milliseconds (20 seconds)
        let slideInterval; // Variable to hold the interval

        // GitHub repository details
        const repoUsername = "IkeSimba"; // Your GitHub username
        const repoName = "MyUrl";         // Your repository name
        const branch = "V0";               // Your branch name
        const folderPath = "Gallery";      // Path to your images folder

        let mediaFiles = []; // To store all media URLs (images and videos)

        async function fetchMedia() {
            const apiUrl = `https://api.github.com/repos/${repoUsername}/${repoName}/contents/${folderPath}?ref=${branch}`;
            const response = await fetch(apiUrl);
            if (!response.ok) {
                console.error("Failed to fetch media:", response.statusText);
                return;
            }
            const data = await response.json();
            mediaFiles = data
                .filter(file => /\.(jpg|jpeg|png|gif|mp4|webm|mov)$/i.test(file.name)) // Include .mov
                .sort((a, b) => a.name.localeCompare(b.name))
                .map(file => `https://raw.githubusercontent.com/${repoUsername}/${repoName}/${branch}/${folderPath}/${file.name}`);

            console.log("Fetched media files:", mediaFiles); // Log constructed media URLs

            // Start with a random index
            currentIndex = Math.floor(Math.random() * mediaFiles.length);
            updateSlider();
            updateCommitTimestamp();
            startSlideShow(); // Start the automatic slideshow
        }

        async function initSlider() {
            await fetchMedia();
            createSlides();
            updateSlider();
        }

        function createSlides() {
            slidesContainer.innerHTML = ''; // Clear existing slides
            mediaFiles.forEach((media, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                if (index === currentIndex) slide.classList.add('current');

                // Create video element only if the media is a video
                if (media.endsWith('.mp4') || media.endsWith('.webm') || media.endsWith('.mov')) {
                    const video = document.createElement('video');
                    video.src = media;
                    video.controls = true; // Enable controls for the video
                    video.style.display = 'block'; // Ensure video is block-level
                    slide.appendChild(video);
                } else {
                    slide.style.backgroundImage = `url("${media}")`;
                    slide.style.backgroundRepeat = "no-repeat";
                    slide.style.backgroundPosition = "center";
                    slide.style.backgroundSize = "contain";
                }

                slidesContainer.appendChild(slide);

                // Create thumbnail for each media file
                const thumbnail = document.createElement('img');
                thumbnail.src = media;
                thumbnail.className = 'thumbnail';
                thumbnail.addEventListener('click', () => {
                    openSlide(index);
                    highlightThumbnail(index);
                });
                thumbnailContainer.appendChild(thumbnail);
            });
        }

        const nextSlide = () => {
            currentIndex++;
            if (currentIndex >= mediaFiles.length) {
                currentIndex = 0;
            }
            updateSlider();
        };

        const prevSlide = () => {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = mediaFiles.length - 1;
            }
            updateSlider();
        };

        const updateSlider = () => {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                slide.classList.remove('current');
                if (index === currentIndex) {
                    slide.classList.add('current');
                    updateVideoControls(mediaFiles[currentIndex]);
                }
            });
            highlightThumbnail(currentIndex);
            updateCommitTimestamp();
        };

        const highlightThumbnail = (index) => {
            const thumbnails = document.querySelectorAll('.thumbnail');
            thumbnails.forEach((thumb, i) => {
                thumb.classList.remove('selected');
                if (i === index) {
                    thumb.classList.add('selected');
                }
            });
        };

        const openSlide = (index) => {
            currentIndex = index;
            updateSlider();
            resetSlideShow(); // Reset slideshow timer when user navigates
        };

        const updateVideoControls = (media) => {
            videoControlsContainer.innerHTML = ''; // Clear existing controls
            if (media.endsWith('.mp4') || media.endsWith('.webm') || media.endsWith('.mov')) {
                const video = document.createElement('video');
                video.src = media;
                video.controls = true;
                video.style.width = '100%'; // Optional: Adjust width to your preference
                videoControlsContainer.appendChild(video);
            }
        };

        const updateCommitTimestamp = () => {
            const date = new Date();
            commitTimestamp.innerText = `Last updated: ${date.toLocaleString()}`;
        };

        const startSlideShow = () => {
            slideInterval = setInterval(nextSlide, intervalTime); // Start the slideshow
        };

        const resetSlideShow = () => {
            clearInterval(slideInterval); // Stop the current interval
            startSlideShow(); // Start a new one
        };

        toggleButton.addEventListener('click', () => {
            const thumbnailsVisible = thumbnailContainer.style.display === 'flex';
            thumbnailContainer.style.display = thumbnailsVisible ? 'none' : 'flex';
        });

        randomizeButton.addEventListener('click', () => {
            currentIndex = Math.floor(Math.random() * mediaFiles.length);
            updateSlider();
            resetSlideShow(); // Reset slideshow timer when user randomizes
        });

        nextButton.addEventListener('click', () => {
            nextSlide();
            resetSlideShow(); // Reset slideshow timer when user clicks next
        });

        prevButton.addEventListener('click', () => {
            prevSlide();
            resetSlideShow(); // Reset slideshow timer when user clicks prev
        });

// Handle file uploads
uploadButton.addEventListener("click", () => {
    window.open('https://github.com/IkeSimba/MyUrl/upload/V0/Gallery', '_blank');
});

        // Initialize the slider on page load
        initSlider();
    </script>
</body>

</html>
